name: Refresh live data

# Keeps the database in sync with the live tournament by running the data refresh
# on a schedule. Configure these repository secrets (Settings → Secrets and
# variables → Actions):
#   DATABASE_URL           Neon pooled connection string (neondb_owner role)
#   DIRECT_URL             Neon direct connection string
#   FOOTBALL_DATA_API_KEY  football-data.org API token
#
# Trigger manually any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    # Every 3 hours (UTC). Adjust the cadence to taste.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

# Never let two refreshes overlap.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREDICTION_DATA_SOURCE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    steps:
      # Fail fast with an actionable message when a required secret is missing,
      # instead of letting Prisma/the API throw an opaque error mid-run.
      - name: Validate required secrets
        run: |
          missing=0
          for name in DATABASE_URL DIRECT_URL FOOTBALL_DATA_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refresh aborted: one or more required repository secrets are missing."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Refresh live data
        run: npm run data:refresh
